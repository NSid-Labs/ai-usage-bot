name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q bot.py
      - name: Tests
        run: python -m unittest -v
      - name: Docker build
        run: docker build -t ai-usage-bot:ci .
